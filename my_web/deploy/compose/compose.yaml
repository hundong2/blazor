name: my-web-services

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:?Set OPEN_WEBUI_IMAGE to a pinned release tag or digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_HOST_PORT:-17832}:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:${OLLAMA_HOST_PORT:-17836}"
      WEBUI_URL: "${WEBUI_URL:?Set WEBUI_URL to the public proxied URL}"
      CORS_ALLOW_ORIGIN: "${WEBUI_URL:?Set WEBUI_URL to the public proxied URL}"
      WEBUI_SESSION_COOKIE_SECURE: "true"
      ENABLE_SIGNUP: "false"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  open-webui-data:
