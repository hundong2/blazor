name: My Web Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to package
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: my_web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: my_web/**/packages.lock.json
      - name: Resolve version
        id: version
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          if ($version -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Restore and test
        run: |
          dotnet restore .\MyWeb.slnx --locked-mode
          dotnet test .\MyWeb.slnx -c Release --no-restore
      - name: Publish Windows package
        run: |
          dotnet publish .\src\MyWeb.Portal\MyWeb.Portal.csproj -c Release -r win-x64 --self-contained false -p:RestoreLockedMode=true -o .\artifacts\publish
          Copy-Item .\config\appsettings.Production.example.json .\artifacts\publish\
          Copy-Item .\scripts .\artifacts\publish\scripts -Recurse
          Copy-Item .\env .\artifacts\publish\env -Recurse
      - name: Package and checksum
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $archive = ".\artifacts\my-web-$version-win-x64.zip"
          Compress-Archive -Path .\artifacts\publish\* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          gh release create $version ".\artifacts\my-web-$version-win-x64.zip" ".\artifacts\my-web-$version-win-x64.zip.sha256" --draft --generate-notes --verify-tag
